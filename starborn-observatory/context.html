<!doctype html><meta charset="utf-8"><title>Starborn Observatory - Quest Context</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>Quest Context Trace</h1></div><div class="status"><i></i> DIALOGUE / STATE</div></header><div class="toolbar"><select id="quest"></select></div><div id="app"></div></main><script>
const A='../app/src/main/assets/';let qs=[],dlg=[],ms=[],events=[],cin=[];const $=s=>document.querySelector(s);async function get(k){return fetch(A+k+'.json').then(r=>r.json()).catch(()=>[])}async function load(){[qs,dlg,ms,events,cin]=await Promise.all(['quests','dialogue','milestones','events','cinematics'].map(get));$('#quest').innerHTML=qs.map(q=>'<option value="'+q.id+'">'+(q.title||q.id)+'</option>').join('');show(qs[0]?.id)}function show(id){let q=qs.find(x=>x.id===id),blob=JSON.stringify(q);let d=dlg.filter(x=>blob.includes(x.id)),m=ms.filter(x=>blob.includes(x.id)),e=events.filter(x=>blob.includes(x.id)),c=cin.filter(x=>blob.includes(x.id));$('#app').innerHTML='<div class="metrics"><div class="metric"><label>DIALOGUE LINKS</label><strong>'+d.length+'</strong></div><div class="metric"><label>MILESTONE LINKS</label><strong>'+m.length+'</strong></div><div class="metric"><label>EVENT LINKS</label><strong>'+e.length+'</strong></div><div class="metric"><label>CINEMATIC LINKS</label><strong>'+c.length+'</strong></div></div><div class="grid"><div class="card"><h2>Quest state flow</h2><p class="lead">'+(q.description||q.summary||'')+'</p><div class="callout">START → STAGES → TASKS → REWARDS → FOLLOW-UP STATE</div><h3>Milestones referenced by this quest</h3>'+(m.map(x=>'<div class="finding"><b>'+ (x.name||x.id)+'</b><br><span class="label">'+x.id+'</span><p>'+(x.description||'')+'</p></div>').join('')||'<p class="muted">No direct milestone IDs found in this quest record.</p>')+'</div><div class="card"><h2>Presentation and triggers</h2><h3>Dialogue</h3>'+(d.map(x=>'<div class="finding"><b>'+x.speaker+'</b><p>'+x.text+'</p><span class="label">'+x.id+'</span></div>').join('')||'<p class="muted">No direct dialogue IDs found.</p>')+'<h3>Events / cinematics</h3>'+(e.map(x=>'<div class="finding"><b>'+(x.title||x.id)+'</b><br><span class="label">EVENT · '+x.id+'</span></div>').join('')+c.map(x=>'<div class="finding"><b>'+(x.title||x.id)+'</b><br><span class="label">CINEMATIC · '+x.id+'</span></div>').join('')||'<p class="muted">No direct event or cinematic IDs found.</p>')+'</div></div>'}$('#quest').onchange=e=>show(e.target.value);load();
</script>
