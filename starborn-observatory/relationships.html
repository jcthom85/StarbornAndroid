<!doctype html><meta charset="utf-8"><title>Starborn Observatory - Relationships</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>Scenario Lens & Reference Graph</h1></div></header><div id="app"></div></main><script>
const A='../app/src/main/assets/';let d={rooms:[],quests:[],enemies:[],items:[],skills:[]};async function load(){for(const k of Object.keys(d))d[k]=await fetch(A+({'skills':'skills'}[k]||k)+'.json').then(r=>r.json());draw()}function draw(){let rs=d.rooms,qs=d.quests;document.querySelector('#app').innerHTML='<div class="toolbar"><select id="room">'+rs.map(r=>'<option value="'+r.id+'">'+(r.title||r.id)+'</option>').join('')+'</select></div><div id="body"></div>';document.querySelector('#room').onchange=e=>show(e.target.value);show(rs[0]?.id)}function show(id){let r=d.rooms.find(x=>x.id===id),related=d.quests.filter(q=>JSON.stringify(q).includes(id));document.querySelector('#body').innerHTML='<div class="grid"><div class="card"><h2>'+(r.title||r.id)+'</h2><p class="lead">'+(r.description||'')+'</p><p><b>ENVIRONMENT:</b> '+(r.env||'unknown')+'<br><b>WEATHER:</b> '+(r.weather||'none')+'</p><h2>Connections</h2><div class="chips">'+Object.entries(r.connections||{}).map(([a,b])=>'<span class="chip">'+a+' → '+b+'</span>').join('')+'</div></div><div class="card"><h2>Participating content</h2><p><b>ENEMIES</b><br>'+((r.enemies||[]).join(', ')||'None')+'</p><p><b>NPCS</b><br>'+((r.npcs||[]).join(', ')||'None')+'</p><p><b>ITEMS</b><br>'+((r.items||[]).join(', ')||'None')+'</p><h2>Related quests</h2>'+(related.map(q=>'<div class="finding">'+(q.title||q.id)+'</div>').join('')||'None found')+'</div></div>'}load();
</script>
