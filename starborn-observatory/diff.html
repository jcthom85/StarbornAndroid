<!doctype html><meta charset="utf-8"><title>Starborn Observatory - State Diff</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>Quest Stage State Diff</h1></div><div class="status"><i></i> BEFORE / AFTER</div></header><div class="toolbar"><select id="quest"></select><select id="stage"></select></div><div id="app"></div></main><script>
const A='../app/src/main/assets/';let qs=[],q,s;const $=x=>document.querySelector(x);async function load(){qs=await fetch(A+'quests.json').then(r=>r.json());$('#quest').innerHTML=qs.map(x=>'<option value="'+x.id+'">'+(x.title||x.id)+'</option>').join('');setQuest(qs[0]?.id)}function setQuest(id){q=qs.find(x=>x.id===id);$('#stage').innerHTML=(q?.stages||[]).map((x,i)=>'<option value="'+i+'">'+String(i+1).padStart(2,'0')+' / '+(x.title||x.id)+'</option>').join('');show(0)}function show(i){s=q?.stages?.[+i];if(!s)return;let tasks=s.tasks||[],before=Object.entries(s).filter(([k])=>/require|condition|prereq|unlock/i.test(k)),after=Object.entries(q).filter(([k])=>/reward|milestone|unlock|event|cinematic/i.test(k));$('#app').innerHTML='<div class="metrics"><div class="metric"><label>STAGE</label><strong>'+(+i+1)+' / '+q.stages.length+'</strong></div><div class="metric"><label>TASKS</label><strong>'+tasks.length+'</strong></div><div class="metric"><label>PREREQUISITES</label><strong>'+before.length+'</strong></div><div class="metric"><label>QUEST REWARDS</label><strong>'+(q.rewards||[]).length+'</strong></div></div><div class="grid"><div class="card"><h2>Before: required state</h2><p class="lead">What must be true before the player can meaningfully enter this stage.</p>'+(before.map(([k,v])=>'<div class="finding warning"><b>'+k+'</b><pre>'+JSON.stringify(v,null,2)+'</pre></div>').join('')||'<div class="finding">No explicit stage prerequisites authored.</div>')+'<h2>During: player actions</h2><ol>'+tasks.map(t=>'<li>'+ (t.text||t.title||t.id)+'</li>').join('')+'</ol></div><div class="card"><h2>After: authored consequences</h2><p class="lead">What the quest record says is awarded or connected after completion.</p>'+(after.map(([k,v])=>'<div class="finding good"><b>'+k+'</b><pre>'+JSON.stringify(v,null,2)+'</pre></div>').join('')||'<div class="finding">No direct consequence fields found on this quest record.</div>')+'<h2>Stage record</h2><pre>'+JSON.stringify(s,null,2)+'</pre></div></div>'}$('#quest').onchange=e=>setQuest(e.target.value);$('#stage').onchange=e=>show(e.target.value);load();
</script>
