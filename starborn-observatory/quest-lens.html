<!doctype html><meta charset="utf-8"><title>Starborn Observatory - Quest Lens</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>Quest Stage Consequences</h1></div><div class="status"><i></i> STORY CONTEXT</div></header><div class="toolbar"><select id="quest"></select></div><div id="app"></div></main><script>
const A='../app/src/main/assets/';let quests=[],rooms=[],events=[],cinemas=[],dialogue={};const $=s=>document.querySelector(s);async function get(k){return fetch(A+k+'.json').then(r=>r.json()).catch(()=>[])}async function load(){[quests,rooms,events,cinemas,dialogue]=await Promise.all(['quests','rooms','events','cinematics','dialogue'].map(get));$('#quest').innerHTML=quests.map(x=>'<option value="'+x.id+'">'+(x.title||x.id)+'</option>').join('');show(quests[0]?.id)}function show(id){let q=quests.find(x=>x.id===id);if(!q)return;let blob=JSON.stringify(q),relatedRooms=rooms.filter(r=>blob.includes(r.id)),relatedEvents=events.filter(e=>blob.includes(e.id)),relatedC=cinemas.filter(c=>blob.includes(c.id));let rewards=(q.rewards||[]).map(x=>JSON.stringify(x)).join('<br>');$('#app').innerHTML='<div class="metrics"><div class="metric"><label>STAGES</label><strong>'+((q.stages||[]).length)+'</strong></div><div class="metric"><label>TASKS</label><strong>'+((q.stages||[]).reduce((n,s)=>n+(s.tasks||[]).length,0))+'</strong></div><div class="metric"><label>ROOM LINKS</label><strong>'+relatedRooms.length+'</strong></div><div class="metric"><label>REWARDS</label><strong>'+((q.rewards||[]).length)+'</strong></div></div><div class="grid"><div class="card"><h2>'+(q.title||q.id)+'</h2><span class="label">QUEST · '+q.id+' · GIVER: '+(q.giver||'UNKNOWN')+'</span><p class="lead">'+(q.description||q.summary||'')+'</p><h2>Stage sequence</h2>'+(q.stages||[]).map((s,i)=>'<div class="world"><div class="world-row"><b>'+String(i+1).padStart(2,'0')+' / '+(s.title||s.id)+'</b><em>'+(s.tasks||[]).length+' TASKS</em></div><p>'+(s.description||'')+'</p><ol>'+((s.tasks||[]).map(t=>'<li>'+ (t.text||t.title||t.id)+'</li>').join(''))+'</ol></div>').join('')+'</div><div class="card"><h2>Consequences & context</h2><h3>Locations</h3>'+relatedRooms.map(r=>'<div class="finding"><b>'+r.title+'</b><br><span class="label">ROOM · '+r.id+'</span></div>').join('')+'<h3>Events</h3>'+relatedEvents.map(e=>'<div class="finding"><b>'+ (e.title||e.id)+'</b><br><span class="label">EVENT · '+e.id+'</span></div>').join('')+'<h3>Cinematics</h3>'+relatedC.map(c=>'<div class="finding"><b>'+ (c.title||c.id)+'</b><br><span class="label">CINEMATIC · '+c.id+'</span></div>').join('')+'<h3>Rewards</h3><pre>'+rewards+'</pre><h3>Raw quest record</h3><pre>'+JSON.stringify(q,null,2)+'</pre></div></div>'}$('#quest').onchange=e=>show(e.target.value);load();
</script>
