<!doctype html><meta charset="utf-8"><title>Starborn Observatory - Story Moment</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>Story Moment Lens</h1></div><div class="status"><i></i> CONTEXT VIEW</div></header><div class="toolbar"><select id="room"></select></div><div id="app"></div></main><script>
const A='../app/src/main/assets/',R='../app/src/main/res/raw/';let rooms=[],quests=[],tracks=[],cinemas=[];const $=s=>document.querySelector(s);async function load(){[rooms,quests,tracks,cinemas]=await Promise.all([get('rooms'),get('quests'),fetch(A+'audio_catalog.json').then(x=>x.json()).then(x=>x.tracks||[]),get('cinematics')]);$('#room').innerHTML=rooms.map(x=>'<option value="'+x.id+'">'+(x.title||x.id)+'</option>').join('');show(rooms[0]?.id)}async function get(k){return fetch(A+k+'.json').then(x=>x.json()).catch(()=>[])}function show(id){let r=rooms.find(x=>x.id===id),related=quests.filter(q=>JSON.stringify(q).includes(id)),c=cinemas.filter(x=>JSON.stringify(x).includes(id));if(!r)return;let audio=tracks.filter(x=>{let s=JSON.stringify(x).toLowerCase();return s.includes(r.env||'')||s.includes('world_1')});$('#app').innerHTML='<div class="metrics"><div class="metric"><label>ROOM</label><strong>'+r.id+'</strong></div><div class="metric"><label>ENEMIES</label><strong>'+(r.enemies||[]).length+'</strong></div><div class="metric"><label>RELATED QUESTS</label><strong>'+related.length+'</strong></div><div class="metric"><label>CINEMATICS</label><strong>'+c.length+'</strong></div></div><div class="grid"><div class="card"><h2>What the player sees</h2><p class="lead">'+(r.description||'')+'</p><p><b>Environment:</b> '+(r.env||'unknown')+' · <b>Weather:</b> '+(r.weather||'none')+'</p><h3>Room contents</h3><p><b>Enemies:</b> '+((r.enemies||[]).join(', ')||'None')+'<br><b>NPCs:</b> '+((r.npcs||[]).join(', ')||'None')+'<br><b>Items:</b> '+((r.items||[]).join(', ')||'None')+'</p></div><div class="card"><h2>Why this moment exists</h2><h3>Related quests</h3>'+(related.map(q=>'<div class="finding"><b>'+ (q.title||q.id)+'</b><br>'+ (q.summary||q.description||'')+'</div>').join('')||'<p class="muted">No quest reference found in this room record.</p>')+'<h3>Presentation assets</h3>'+(c.map(x=>'<details class="cinematic"><summary><b>'+ (x.title||x.id)+'</b><span>'+x.id+'</span></summary><p>'+((x.steps||[]).map(s=>s.text||'').join(' '))+'</p></details>').join('')||'<p class="muted">No directly referenced cinematic found.</p>')+audio.slice(0,4).map(x=>'<div class="audio-row"><div><b>'+x.id+'</b><span>'+((x.tags||[]).join(' · '))+'</span></div><audio controls preload="none" src="'+R+x.id+'.mp3"></audio></div>').join('')+'</div></div>'}$('#room').onchange=e=>show(e.target.value);load();
</script>
