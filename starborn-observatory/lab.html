<!doctype html><meta charset="utf-8"><title>Starborn Observatory - Audio & Cinematic Lab</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>Audio & Cinematic Lab</h1></div><div class="status"><i></i> LOCAL PREVIEW</div></header><div class="toolbar"><input id="search" placeholder="Search tracks, tags, cinematic titles..."><select id="mode"><option value="all">All assets</option><option value="audio">Audio</option><option value="cinematic">Cinematics</option></select></div><div id="app"></div></main><script>
const A='../app/src/main/assets/',R='../app/src/main/res/raw/';let tracks=[],cinemas=[],q='',mode='all';const $=s=>document.querySelector(s);async function load(){let [a,c]=await Promise.all([fetch(A+'audio_catalog.json').then(r=>r.json()),fetch(A+'cinematics.json').then(r=>r.json())]);tracks=a.tracks||[];cinemas=c||[];draw()}function draw(){q=$('#search').value.toLowerCase();mode=$('#mode').value;let ts=tracks.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)),cs=cinemas.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));let out='';if(mode!=='cinematic')out+='<div class="card"><h2>Audio tracks ('+ts.length+')</h2>'+ts.map(x=>{let id=x.id||'';return '<div class="audio-row"><div><b>'+id+'</b><span>'+(x.type||'audio')+' · '+(x.tags||[]).join(' · ')+'</span></div><audio controls preload="none" src="'+R+id+'.mp3"></audio></div>'}).join('')+'</div>';if(mode!=='audio')out+='<div class="card"><h2>Cinematics ('+cs.length+')</h2>'+cs.map(x=>'<details class="cinematic"><summary><b>'+ (x.title||x.id)+'</b><span>'+x.id+' · '+(x.steps||[]).length+' steps</span></summary><div class="script">'+(x.steps||[]).map((s,i)=>'<div><span class="step">'+String(i+1).padStart(2,'0')+'</span><b>'+((s.speaker||s.type||'NARRATION').toUpperCase())+'</b><p>'+ (s.text||'')+'</p></div>').join('')+'</div></details>').join('')+'</div>';$('#app').innerHTML=out||'<div class="card"><p>No assets found.</p></div>'}$('#search').oninput=draw;$('#mode').onchange=draw;load();
</script>
