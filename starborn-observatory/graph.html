<!doctype html><meta charset="utf-8"><title>Starborn Observatory - Reference Graph</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>Typed Reference Graph</h1></div><div class="status"><i></i> INDEXED RELATIONSHIPS</div></header><div class="toolbar"><input id="search" placeholder="Search records..."><select id="type"><option value="all">All types</option></select></div><div class="graph-layout"><div class="card"><h2>Records</h2><div id="records"></div></div><div class="card" id="detail"><h2>Select a record</h2><p class="muted">Relationships will appear here.</p></div></div></main><script type="module">import{createAssetIndex}from'./asset-index.js';const $=s=>document.querySelector(s);const index=await createAssetIndex();const records=index.records(),links=index.links();const types=[...new Set(records.map(x=>x.type))];$('#type').innerHTML+=[...types].sort().map(x=>'<option>'+x+'</option>').join('');function draw(){let q=$('#search').value.toLowerCase(),t=$('#type').value;let xs=records.filter(x=>(t==='all'||x.type===t)&&(!q||JSON.stringify(x.data).toLowerCase().includes(q)));$('#records').innerHTML=xs.slice(0,200).map(x=>'<div class="entity" data-id="'+x.id+'"><b>'+x.name+'</b><span>'+x.type+' · '+x.id+'</span></div>').join('')||'<p class="muted">No records found.</p>';document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>show(records.find(x=>x.id===e.dataset.id)))}function show(x){let edges=links.filter(e=>e.from.id===x.id||e.to.id===x.id);$('#detail').innerHTML='<h2>'+x.name+'</h2><span class="label">'+x.type.toUpperCase()+' · '+x.id+'</span><h3>Typed connections ('+edges.length+')</h3>'+(edges.map(e=>{let other=e.from.id===x.id?e.to:e.from,dir=e.from.id===x.id?'OUTBOUND':'INBOUND';return '<div class="finding"><b>'+dir+' · '+e.type+'</b><br>'+other.name+' <span class="label">'+other.type+' · '+other.id+'</span></div>'}).join('')||'<p class="muted">No typed connections found.</p>')+'<h3>Raw record</h3><pre>'+JSON.stringify(x.data,null,2)+'</pre>'}$('#search').oninput=draw;$('#type').onchange=draw;draw();</script>
