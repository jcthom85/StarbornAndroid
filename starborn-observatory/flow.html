<!doctype html><meta charset="utf-8"><title>Starborn Observatory - Campaign Flow</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>Campaign Flow</h1></div><div class="status"><i></i> STORY TRACE</div></header><div class="toolbar"><input id="search" placeholder="Search the campaign..."><select id="world"><option value="all">All worlds</option></select></div><div id="app"></div></main><script>
const A='../app/src/main/assets/';let worlds=[],hubs=[],rooms=[],quests=[];const $=s=>document.querySelector(s);const label=x=>x?.title||x?.name||x?.id||'Untitled';async function load(){[worlds,hubs,rooms,quests]=await Promise.all(['worlds','hubs','rooms','quests'].map(x=>fetch(A+x+'.json').then(r=>r.json()).catch(()=>[])));$('#world').innerHTML+='<option value="unassigned">Unassigned / global</option>'+worlds.map(x=>'<option value="'+x.id+'">'+label(x)+'</option>').join('');draw()}function draw(){let q=$('#search').value.toLowerCase(),w=$('#world').value,xs=quests.filter(x=>(w==='all'||w==='unassigned'||JSON.stringify(x).includes(w))&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('#app').innerHTML='<div class="metrics"><div class="metric"><label>QUESTS SHOWN</label><strong>'+xs.length+'</strong></div><div class="metric"><label>STAGES</label><strong>'+xs.reduce((n,x)=>n+(x.stages||[]).length,0)+'</strong></div><div class="metric"><label>TASKS</label><strong>'+xs.reduce((n,x)=>n+(x.stages||[]).reduce((m,s)=>m+(s.tasks||[]).length,0),0)+'</strong></div><div class="metric"><label>REWARDS</label><strong>'+xs.reduce((n,x)=>n+(x.rewards||[]).length,0)+'</strong></div></div><div class="flow">'+xs.map((x,i)=>{let hub=hubs.find(h=>h.id===x.hub_id);return '<article class="flow-card"><div class="flow-index">'+String(i+1).padStart(2,'0')+'</div><div class="flow-main"><div class="world-row"><h2>'+label(x)+'</h2><span class="pill">'+(x.id||'')+'</span></div><p class="lead">'+(x.summary||x.description||'')+'</p><div class="flow-meta"><span>GIVER: '+(x.giver||'UNKNOWN')+'</span><span>HUB: '+(hub?.title||x.hub_id||'UNKNOWN')+'</span><span>'+(x.rewards||[]).length+' REWARDS</span></div><div class="stages">'+(x.stages||[]).map((s,j)=>'<div class="stage"><b>'+String(j+1).padStart(2,'0')+' / '+(s.title||s.id)+'</b><p>'+(s.description||'')+'</p><ol>'+((s.tasks||[]).map(t=>'<li>'+ (t.text||t.title||t.id)+'</li>').join(''))+'</ol></div>').join('')+'</div></div></article>'}).join('')+'</div>'}$('#search').oninput=draw;$('#world').onchange=draw;load();
</script>
