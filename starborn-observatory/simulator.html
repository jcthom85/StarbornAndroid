<!doctype html><meta charset="utf-8"><title>Starborn Observatory - State Simulator</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>Quest Lifecycle Simulator</h1></div><div class="status"><i></i> DISPOSABLE STATE</div></header><div class="sim-banner">Temporary browser state. Nothing is written to Starborn saves or source assets.</div><div class="toolbar"><select id="quest"></select><select id="stage"></select></div><div class="sim-layout"><div class="card"><h2>Stage tasks</h2><p id="stage-desc" class="muted"></p><div id="tasks"></div><button id="advance" class="active" disabled>Complete stage / advance</button></div><div class="card"><h2>Simulated transition</h2><div id="result"></div></div></div></main><script type="module">import{evaluateCondition}from'./state-rules.js';const A='../app/src/main/assets/';let qs=[],q,s,stageIndex=0,tasks=new Set(),completedQuests=new Set(),rewards=[];const $=x=>document.querySelector(x);async function load(){qs=await fetch(A+'quests.json').then(r=>r.json()).catch(()=>[]);$('#quest').innerHTML=qs.map(x=>'<option value="'+x.id+'">'+(x.title||x.id)+'</option>').join('');setQuest(qs[0]?.id)}function setQuest(id){q=qs.find(x=>x.id===id);stageIndex=0;completedQuests.delete(id);rewards=[];setStage()}function setStage(){s=q?.stages?.[stageIndex];tasks.clear();$('#stage').innerHTML=(q?.stages||[]).map((x,i)=>'<option value="'+i+'" '+(i===stageIndex?'selected':'')+'>'+String(i+1).padStart(2,'0')+' / '+(x.title||x.id)+'</option>').join('');$('#stage-desc').textContent=s?.description||'';$('#tasks').innerHTML=(s?.tasks||[]).map((x,i)=>'<label class="toggle"><input type="checkbox" data-task="'+i+'> '+(x.text||x.title||x.id)+'</label>').join('');document.querySelectorAll('[data-task]').forEach(x=>x.onchange=()=>{x.checked?tasks.add(+x.dataset.task):tasks.delete(+x.dataset.task);evaluate()});evaluate()}function evaluate(){if(!s)return;let total=(s.tasks||[]).length,done=tasks.size,ready=total===0||done===total;$('#advance').disabled=!ready;$('#result').innerHTML='<div class="metrics"><div class="metric"><label>STAGE</label><strong>'+ (stageIndex+1)+'/'+q.stages.length+'</strong></div><div class="metric"><label>TASKS</label><strong>'+done+'/'+total+'</strong></div><div class="metric"><label>QUEST</label><strong>'+ (completedQuests.has(q.id)?'COMPLETE':'ACTIVE')+'</strong></div></div><div class="finding '+(ready?'good':'warning')+'">'+(ready?'✓ Stage can advance.':'! Complete every task to advance.')+'</div><p class="lead">'+(ready?'Completing this stage applies its transition and moves the disposable snapshot forward.':'The player remains in the current stage.')+'</p>'}function advance(){if($('#advance').disabled)return;if(stageIndex<q.stages.length-1){stageIndex++;setStage();return}completedQuests.add(q.id);rewards=q.rewards||[];$('#result').innerHTML+='<div class="finding good">✓ Quest complete in simulation. Rewards applied to snapshot:</div><pre>'+JSON.stringify(rewards,null,2)+'</pre>'}$('#quest').onchange=e=>setQuest(e.target.value);$('#stage').onchange=e=>{stageIndex=+e.target.value;setStage()};$('#advance').onclick=advance;load();</script>
