<!doctype html><meta charset="utf-8"><title>Starborn Observatory - Maps</title><link rel="stylesheet" href="style.css"><main><header><div><p class="eyebrow">STAR BORN // OBSERVATORY</p><h1>World / Hub / Node Maps</h1></div></header><section id="app"></section></main><script>
const app=document.querySelector('#app'),A='../app/src/main/assets/',I='../world_assets/src/main/assets/';let d={worlds:[],hubs:[],nodes:[],rooms:[]},w,h,n,r;async function load(){for(const [k,f] of Object.entries({worlds:'worlds',hubs:'hubs',nodes:'hub_nodes',rooms:'rooms'}))d[k]=await fetch(A+f+'.json').then(x=>x.json());w=d.worlds[0].id;draw()}function sel(label,arr,val){return `<label>${label}<select id="${label}">${arr.map(x=>`<option value="${x.id}" ${x.id==val?'selected':''}>${x.title}</option>`).join('')}</select></label>`}function draw(){let hs=d.hubs.filter(x=>x.world_id==w);h=hs.some(x=>x.id==h)?h:hs[0]?.id;let ns=d.nodes.filter(x=>x.hub_id==h);n=ns.some(x=>x.id==n)?n:ns[0]?.id;let node=d.nodes.find(x=>x.id==n),rs=(node?.rooms||[]).map(id=>d.rooms.find(x=>x.id==id)).filter(Boolean);r=rs.some(x=>x.id==r)?r:rs[0]?.id;let hub=d.hubs.find(x=>x.id==h),room=rs.find(x=>x.id==r);app.innerHTML=`<div class="card"><div class="map-controls">${sel('WORLD',d.worlds,w)}${sel('HUB',hs,h)}${sel('NODE',ns,n)}${sel('ROOM',rs,r)}</div><img class="map-art" src="${I}${hub?.background_image||''}"><h2>${hub?.title||''}</h2><p>${hub?.description||''}</p><h2>Node map</h2><div class="node-map">${ns.map(x=>`<button data-node="${x.id}">${x.title} (${x.rooms.length} rooms)</button>`).join('')}</div></div><div class="card">${room?`<img class="room-art" src="${I}${room.background_image||''}"><h2>${room.title}</h2><p>${room.description}</p><p><b>Connections:</b> ${Object.entries(room.connections||{}).map(([a,b])=>a+' -> '+b).join(' | ')||'None'}</p><p><b>Enemies:</b> ${room.enemies.join(', ')||'None'}<br><b>NPCs:</b> ${room.npcs.join(', ')||'None'}<br><b>Items:</b> ${room.items.join(', ')||'None'}</p></div>`:''}</div>`;['WORLD','HUB','NODE','ROOM'].forEach(id=>document.querySelector('#'+id).onchange=e=>{if(id==='WORLD'){w=e.target.value;h=n=r=null}if(id==='HUB'){h=e.target.value;n=r=null}if(id==='NODE'){n=e.target.value;r=null}if(id==='ROOM')r=e.target.value;draw()});document.querySelectorAll('[data-node]').forEach(x=>x.onclick=()=>{n=x.dataset.node;r=null;draw()})}load();</script>
