<!doctype html><html><head><meta charset="utf-8"><title>Starborn Observatory</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071017;color:#e8f3f5;font:14px Arial}body{display:flex}aside{width:230px;background:#08141c;border-right:1px solid #1d3542;padding:28px 16px;box-sizing:border-box}.brand{font-weight:bold;letter-spacing:2px;font-size:17px}.brand b{color:#ffc857;font-size:25px;margin-right:9px}.brand small{display:block;color:#72e6ed;font-size:10px;letter-spacing:1px;margin:5px 0 0 35px}nav{margin-top:55px;display:grid;gap:8px}button{border:1px solid transparent;background:transparent;color:#78939e;text-align:left;padding:13px;border-radius:5px;cursor:pointer;font-size:14px}button:hover,button.active{color:#72e6ed;background:#102833;border-color:#285260}.note{position:absolute;bottom:24px;color:#44606b;font:10px monospace;line-height:1.7}main{flex:1;height:100%}iframe{width:100%;height:100%;border:0}</style></head><body><aside><div class="brand"><b>*</b>STAR BORN<small>OBSERVATORY</small></div><nav><button data-page="index.html">Overview</button><button data-page="maps.html">World / Hub / Room Maps</button><button data-page="console.html">Story & Entity Console</button><button data-page="relationships.html">Scenario Lens</button><button data-page="graph.html">Reference Graph</button><button data-page="simulator.html">State Simulator</button><button data-page="lab.html">Audio & Cinematic Lab</button></nav><div class="note">READ-ONLY<br>LOCAL ASSET SNAPSHOT</div></aside><main><iframe id="view" src="index.html" title="Observatory workspace"></iframe></main><script>const frame=document.querySelector('#view');function clean(){try{const d=frame.contentDocument;d.head.insertAdjacentHTML('beforeend','<style>aside{display:none!important}body{display:block!important}main{width:100%!important;max-width:none!important;padding:42px 52px!important}</style>')}catch(e){}}frame.addEventListener('load',clean);document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.src=b.dataset.page;document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelector('button').classList.add('active');clean()</script></body></html>
