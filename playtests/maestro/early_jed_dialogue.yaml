appId: com.junewiregames.starborn.prealpha
---
# Verifies the route from Nova's bunk to Jed and his opening dialogue.
#
# The onboarding pass removed the up-front quest card / CONTINUE chain after
# New Game, and the canon migration rewrote Jed's greeting. The room route
# below matches the one exercised by fun_opening_mastery.yaml.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- tapOn: "New Game"
- tapOn:
    text: "Begin New Game"
    optional: true
- extendedWaitUntil:
    visible: "Nova's Bunk"
    timeout: 90000
- assertVisible: "bunk light"
- tapOn: "bunk light"
- extendedWaitUntil:
    visible: ".*The bunk light coughs on.*"
    timeout: 10000
- tapOn: ".*The bunk light coughs on.*"
- tapOn: "scorched conduit"
- extendedWaitUntil:
    visible: ".*Three repair requests.*closed automatically.*"
    timeout: 15000
- tapOn: ".*Three repair requests.*closed automatically.*"
- extendedWaitUntil:
    visible: "Swipe toward any open exit to move.*"
    timeout: 15000
- tapOn: "CONTINUE"
- tapOn: "Travel west"
- extendedWaitUntil:
    visible: "Pod Row"
    timeout: 60000
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Lift Shaft"
    timeout: 15000
- tapOn: "Travel west"
- extendedWaitUntil:
    visible: "Jed's Bunk"
    timeout: 15000
- tapOn: "Jed"
- extendedWaitUntil:
    visible: ".*look awful.*"
    timeout: 15000
- assertVisible: "Jed"
- takeScreenshot: early-jed-dialogue
