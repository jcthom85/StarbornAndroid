appId: ${APP_ID}
---
- runFlow: opening_equipment.yaml
- tapOn: "Close field menu"
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "Lift Shaft"
    timeout: 15000
- extendedWaitUntil:
    visible: "Head out of the Pit toward Jed.*"
    timeout: 10000
- tapOn: "CONTINUE"
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Pit Landing"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "Homestead Quarter"
    timeout: 15000
- tapOn: "Enter Jed's Workshop"
- tapOn: "Enter"
- extendedWaitUntil:
    visible: "Scrap Yard"
    timeout: 15000
- tapOn: "loader diagnostic strip"
- extendedWaitUntil:
    visible: ".*SAFETY GOVERNOR BYPASSED.*"
    timeout: 15000
- tapOn: ".*SAFETY GOVERNOR BYPASSED.*"
- extendedWaitUntil:
    visible: "Scrap Yard"
    timeout: 15000
- assertVisible: "Engage Faulted Loader"
- tapOn: "Engage Faulted Loader"
- extendedWaitUntil:
    visible: "HOSTILE CONTACT"
    timeout: 15000
- extendedWaitUntil:
    visible: "Nova"
    timeout: 30000
- tapOn: "Nova"
- extendedWaitUntil:
    visible: "Abilities"
    timeout: 30000
- tapOn: "Abilities"
- extendedWaitUntil:
    visible: "Arc Tether"
    timeout: 15000
- tapOn: "Use"
- extendedWaitUntil:
    visible: ".*Faulted Loader.*"
    timeout: 15000
- tapOn: ".*Faulted Loader.*"
- extendedWaitUntil:
    visible: "Weakness exploited"
    timeout: 15000
- takeScreenshot: fun-opening-weakness-exploited
# Combat damage is unseeded (weapon roll + ~6.6% crit), so the loader dies in a
# variable number of basic attacks. Every follow-up swing is guarded so an early
# kill cannot over-run the flow.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible: "Spoils Recovered"
          commands:
            - waitForAnimationToEnd:
                timeout: 10000
            - tapOn: "Nova"
            - extendedWaitUntil:
                visible: "Attack"
                timeout: 30000
            - tapOn: "Attack"
            - extendedWaitUntil:
                visible: ".*Faulted Loader.*"
                timeout: 15000
            - tapOn: ".*Faulted Loader.*"
- extendedWaitUntil:
    visible: "Spoils Recovered"
    timeout: 60000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*loader locks, shudders.*"
    timeout: 15000
- tapOn: ".*loader locks, shudders.*"
- extendedWaitUntil:
    visible: "Scrap Yard"
    timeout: 15000
- assertVisible: ".*faulted loader rests cold.*"
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Jed's Shutter"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*Cold loop's split.*"
    timeout: 15000
- tapOn: "Dialogue Popup. Tap to continue"
- tapOn: "Dialogue Popup. Tap to continue"
- tapOn: "Dialogue Popup. Tap to continue"
- tapOn: "MENU"
- tapOn: "Tinker"
- tapOn: "Open Tinkering"
- extendedWaitUntil:
    visible: "Schematics"
    timeout: 15000
- extendedWaitUntil:
    visible: "At Jed's workbench.*"
    timeout: 10000
- tapOn: "CONTINUE"
- extendedWaitUntil:
    visible: "Check the requirements.*"
    timeout: 15000
- tapOn: "CONTINUE"
- tapOn: "Schematics"
- tapOn: "Repair.*"
- extendedWaitUntil:
    visible: "Functional Cryo-Inductor"
    timeout: 10000
- tapOn: "Auto-Fill Functional Cryo-Inductor"
- tapOn: "Craft Functional Cryo-Inductor"
- extendedWaitUntil:
    visible: ".*Cryo Vent is online.*Brittle.*"
    timeout: 15000
- takeScreenshot: fun-opening-build-changed
