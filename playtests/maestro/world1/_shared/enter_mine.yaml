appId: ${APP_ID}
---
# The authorized elevator now uses its north exit to reveal the Deep Mine node.
- tapOn:
    id: travel-north
- extendedWaitUntil:
    visible: Enter Deep Mine
    timeout: 20000
- runFlow:
    file: drain.yaml
- tapOn: Enter Deep Mine
- tapOn: Descend
- runFlow:
    file: drain.yaml
- extendedWaitUntil:
    visible:
      id: room-mine_landing
    timeout: 20000
