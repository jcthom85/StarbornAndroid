appId: ${APP_ID}
---
- runFlow:
    file: _shared/travel.yaml
    env:
      DIRECTION: west
      ROOM: checkpoint_bay
- runFlow:
    file: _shared/travel.yaml
    env:
      DIRECTION: north
      ROOM: checkpoint_door
- runFlow:
    file: _shared/travel.yaml
    env:
      DIRECTION: north
      ROOM: checkpoint_tunnel
- runFlow:
    file: _shared/travel.yaml
    env:
      DIRECTION: north
      ROOM: admin_lobby
- runFlow:
    file: _shared/talk.yaml
    env:
      NPC: foreman_bogs
- runFlow:
    file: _shared/travel.yaml
    env:
      DIRECTION: east
      ROOM: admin_window
- runFlow:
    file: _shared/travel.yaml
    env:
      DIRECTION: east
      ROOM: admin_security
- runFlow:
    file: _shared/fight.yaml
    env:
      ENEMY: acoustic_bulwark
      GUIDED: "true"
      SKILL: Hydraulic Kick
      STOP_ID: quest-continue-completed-w1_sq03|quest-summary-completed-w1_sq03
- runFlow:
    file: _shared/complete.yaml
    env:
      QUEST: w1_sq03
- runFlow:
    file: _shared/travel.yaml
    env:
      DIRECTION: west
      ROOM: admin_window
- runFlow:
    file: _shared/travel.yaml
    env:
      DIRECTION: west
      ROOM: admin_lobby
- runFlow:
    file: _shared/talk.yaml
    env:
      NPC: foreman_bogs
- takeScreenshot: world1-certification-complete
