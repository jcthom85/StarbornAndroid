appId: ${APP_ID}
---
- launchApp:
    permissions: {}
    clearState: true
- extendedWaitUntil:
    visible: "(Debug|Playtest) Scenarios"
    timeout: 60000
- tapOn: "(Debug|Playtest) Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 10000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "W3 Tuning"
- hideKeyboard
- tapOn: "Hub QA / W3 Tuning"
- runFlow: _shared/confirm_scenario.yaml
- extendedWaitUntil:
    visible: "Prism Gallery"
    timeout: 30000
- assertNotVisible: "light puzzle"
- assertVisible: "prism shutters"
- tapOn: "prism shutters"
- extendedWaitUntil:
    visible: "Orion reads the shutters by ear.*"
    timeout: 10000
- tapOn: ".*Orion reads the shutters by ear.*"
- extendedWaitUntil:
    visible: "Prism Gallery"
    timeout: 10000
- takeScreenshot: hub-tuning-w3
