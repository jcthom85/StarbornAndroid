appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Presence"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "Presence Stress"
    timeout: 15000
- tapOn: "Presence Stress"
- extendedWaitUntil:
    visible: "Presence Stress Test"
    timeout: 90000
# This fixture deliberately over-fills the room (3 NPCs, 4 items, 3 hostile
# parties). The presence dock wraps into a fixed-height panel, so the tail of a
# dense tray sits below the fold and is not on-screen. Assert the entities that
# render above the fold plus every hostile party; the screenshot is the artifact
# for reviewing density itself.
- assertVisible: "Zeke"
- assertVisible: "Scrapper"
- assertVisible: "Medkit I"
- assertVisible: "Engage Dominion Dampener"
- assertVisible: "Engage Acoustic Bulwark"
- assertVisible: "Engage Echo Borer"
- takeScreenshot: presence-stress
