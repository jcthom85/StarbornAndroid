appId: ${APP_ID}
---
- launchApp:
    permissions: {}
    clearState: true
- extendedWaitUntil:
    visible: "(Debug|Playtest) Scenarios"
    timeout: 60000
- tapOn: "(Debug|Playtest) Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 10000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "W6 Source"
- hideKeyboard
- tapOn: "Hub QA / W6 Source"
- runFlow: _shared/confirm_scenario.yaml
- extendedWaitUntil:
    visible: "The Campfire"
    timeout: 30000
- assertVisible: "song-fire"
- assertVisible: "memory oasis"
- tapOn: "memory oasis"
- extendedWaitUntil:
    visible: "The crew eats around the blue fire.*"
    timeout: 10000
- assertNotVisible: "Cook"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "The Campfire"
    timeout: 10000
- assertVisible: "song-fire"
- takeScreenshot: hub-source-rest-story
