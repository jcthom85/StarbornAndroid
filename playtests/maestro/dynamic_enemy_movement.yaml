appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Dynamic"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "Dynamic Patrol"
    timeout: 15000
# This flow verifies the roaming patrol, not dark rooms. It previously waited on
# a "Dark Room" fixture that no longer exists; dark-room rendering is covered by
# dark_room_visibility.yaml. Wait for the patrol to find the player and engage.
- tapOn: "Dynamic Patrol"
- extendedWaitUntil:
    visible: "Conveyor Belt"
    timeout: 90000
- extendedWaitUntil:
    visible: "HOSTILE CONTACT"
    timeout: 120000
- assertVisible: "Pressure Hauler"
- takeScreenshot: dynamic-enemy-movement
