appId: ${APP_ID}
---
- launchApp:
    permissions: {}
    clearState: true
- extendedWaitUntil:
    visible: "(Debug|Playtest) Scenarios"
    timeout: 60000
- tapOn: "(Debug|Playtest) Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 10000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "W4 Forge"
- hideKeyboard
- tapOn: "Hub QA / W4 Forge"
- runFlow: _shared/confirm_scenario.yaml
- extendedWaitUntil:
    visible: "The Forge"
    timeout: 30000
- assertNotVisible: "conveyor puzzle"
- assertNotVisible: "Conveyor Timing Puzzle"
- assertVisible: "anvil cradle"
- tapOn: "anvil cradle"
- extendedWaitUntil:
    visible: "The cradle will not open until.*"
    timeout: 10000
- takeScreenshot: hub-tuning-w4
