appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Enemy Party"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "Enemy Party Combat"
    timeout: 15000
- tapOn: "Enemy Party Combat"
- extendedWaitUntil:
    visible: "Security Checkpoint B"
    timeout: 90000
- extendedWaitUntil:
    visible: "Engage Dominion Dampener"
    timeout: 10000
- tapOn: "Engage Dominion Dampener"
- extendedWaitUntil:
    visible: "HOSTILE CONTACT"
    timeout: 60000
- extendedWaitUntil:
    notVisible: "Round [0-9]+"
    timeout: 1000
- extendedWaitUntil:
    notVisible: "ATB"
    timeout: 1000
- extendedWaitUntil:
    notVisible: "Dominion Dampener \\+ Resonance Buoy"
    timeout: 1000
- extendedWaitUntil:
    notVisible: "R1 READY 4"
    timeout: 1000
- assertVisible: "Nova"
- assertVisible: "Zeke"
- assertVisible: "Dominion Dampener"
- assertVisible: "Resonance Buoy"
- takeScreenshot: enemy-party-combat
