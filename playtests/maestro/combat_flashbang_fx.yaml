appId: ${APP_ID}
---
- launchApp:
    permissions: {}
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "(Debug|Playtest) Scenarios"
    timeout: 10000
- tapOn: "(Debug|Playtest) Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Enemy Party"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "Enemy Party Combat"
    timeout: 15000
- tapOn: "Enemy Party Combat"
- runFlow: _shared/confirm_scenario.yaml
- extendedWaitUntil:
    visible: "Security Checkpoint B"
    timeout: 90000
- extendedWaitUntil:
    visible: "Engage Dominion Dampener"
    timeout: 10000
- tapOn: "Engage Dominion Dampener"
- extendedWaitUntil:
    visible: "HOSTILE CONTACT"
    timeout: 60000
- extendedWaitUntil:
    visible: "Flashbang"
    timeout: 90000
- assertVisible: "Nova"
- assertVisible: "Zeke"
- assertVisible: "Orion"
- assertVisible: "Gh0st"
- takeScreenshot: combat-flashbang-fx
