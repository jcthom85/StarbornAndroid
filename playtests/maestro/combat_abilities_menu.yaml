appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Enemy Party"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "Enemy Party Combat"
    timeout: 15000
- tapOn: "Enemy Party Combat"
- extendedWaitUntil:
    visible: "Security Checkpoint B"
    timeout: 90000
- extendedWaitUntil:
    visible: "Engage Dominion Dampener"
    timeout: 10000
- tapOn: "Engage Dominion Dampener"
- extendedWaitUntil:
    visible: "HOSTILE CONTACT"
    timeout: 60000
- tapOn: "Orion"
- extendedWaitUntil:
    visible: "Abilities"
    timeout: 15000
- tapOn: "Abilities"
- extendedWaitUntil:
    visible: "Abilities"
    timeout: 10000
- assertVisible: "Stasis Stitch"
- tapOn: "Details for Stasis Stitch"
- extendedWaitUntil:
    visible: "Back to Abilities"
    timeout: 10000
- assertVisible: "Target"
- assertVisible: "Cooldown"
- assertVisible: "Uses nanites to heal an ally and grant a minor barrier."
- takeScreenshot: combat-ability-details
- tapOn: "Back to Abilities"
- extendedWaitUntil:
    visible: "Stasis Stitch"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Items"
    timeout: 10000
- tapOn: "Items"
- extendedWaitUntil:
    visible: "Items"
    timeout: 10000
- assertVisible: "Close"
- takeScreenshot: combat-menus-integrated
