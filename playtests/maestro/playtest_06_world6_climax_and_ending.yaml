appId: com.junewiregames.starborn.prealpha
---
# ==========================================================
# Playtest Flow 06: World 6 Climax & Epilogue Progression
# ==========================================================
- launchApp:
    clearState: true

# 1. Title Screen -> Debug Scenarios -> W6 / Finale
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 15000
- tapOn: "Debug Scenarios"
- scrollUntilVisible:
    element: "W6 / Finale"
    direction: DOWN
    timeout: 40000
    speed: 60
- tapOn: "W6 / Finale"

# 2. Verify The Center Finale Environment HUD
- extendedWaitUntil:
    visible: "The Center"
    timeout: 15000
- takeScreenshot: playtest-06-source-center-finale

# 3. Check Stats & Full Party Roster
- tapOn: "MENU"
- extendedWaitUntil:
    visible: "FIELD MENU"
    timeout: 10000
- swipe:
    start: "85%, 15%"
    end: "20%, 15%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Stats"
- extendedWaitUntil:
    visible: "Party Status"
    timeout: 10000
- takeScreenshot: playtest-06-final-party-roster

# 4. Close menu
- tapOn: "Close"
- waitForAnimationToEnd:
    timeout: 1000
