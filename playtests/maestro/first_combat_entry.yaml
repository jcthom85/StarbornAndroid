appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "First Combat"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "The Echo: First Combat"
    timeout: 15000
- tapOn: "The Echo: First Combat"
- extendedWaitUntil:
    visible: "Elevator Landing"
    timeout: 90000
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Main Tunnel Alpha"
    timeout: 15000
- extendedWaitUntil:
    visible: "Engage Echo Borer"
    timeout: 10000
- tapOn: "Engage Echo Borer"
- extendedWaitUntil:
    visible: "Echo-Borer"
    timeout: 60000
- extendedWaitUntil:
    visible: "Nova"
    timeout: 30000
- assertVisible: "Zeke"
- assertVisible: "Gnaw"
- takeScreenshot: first-combat-entry
