appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Presence"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "Presence Stress"
    timeout: 15000
- tapOn: "Presence Stress"
- extendedWaitUntil:
    visible: "Presence Stress Test"
    timeout: 90000
- assertVisible: "Zeke"
- assertVisible: "Medkit I"
- assertVisible: "Engage Acoustic Bulwark"
- tapOn: "Engage Acoustic Bulwark"
- extendedWaitUntil:
    visible: "HOSTILE CONTACT"
    timeout: 60000
- extendedWaitUntil:
    visible: "Acoustic Bulwark"
    timeout: 15000
- tapOn: "Nova"
- extendedWaitUntil:
    visible: "Attack"
    timeout: 20000
- tapOn: "Abilities"
- extendedWaitUntil:
    visible: "Hydraulic Kick"
    timeout: 10000
- tapOn:
    text: "Use"
    index: 1
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
- tapOn: "Acoustic Bulwark"
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible: "Spoils Recovered"
    timeout: 60000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Presence Stress Test"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Engage Acoustic Bulwark"
    timeout: 10000
# The presence dock no longer renders "People"/"Items" category headers; the
# entity chips themselves are the contract.
- assertVisible: "Zeke"
- assertVisible: "Scrapper"
- assertVisible: "Medkit I"
- assertVisible: "Engage Dominion Dampener"
- assertVisible: "Engage Echo Borer"
- takeScreenshot: presence-combat-return
