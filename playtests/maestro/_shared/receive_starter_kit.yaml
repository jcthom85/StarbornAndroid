appId: ${APP_ID}
---
- runFlow: reach_jed.yaml
- repeat:
    times: 30
    while:
      visible:
        id: dialogue-advance
    commands:
      - tapOn:
          id: dialogue-advance
- extendedWaitUntil:
    visible:
      id: item-granted-continue
    timeout: 15000
- assertVisible: "Mining Pistol"
- tapOn:
    id: item-granted-continue
- extendedWaitUntil:
    visible:
      id: item-granted-continue
    timeout: 15000
- assertVisible: "Flux Liner"
- tapOn:
    id: item-granted-continue
- extendedWaitUntil:
    visible:
      id: item-granted-continue
    timeout: 15000
- assertVisible: "Cryo-Inductor"
- tapOn:
    id: item-granted-continue
- extendedWaitUntil:
    visible:
      id: item-granted-continue
    timeout: 15000
- assertVisible: "Scrap Metal.*"
- tapOn:
    id: item-granted-continue
- extendedWaitUntil:
    visible:
      id: item-granted-continue
    timeout: 15000
- assertVisible: "Ration Pack.*"
- tapOn:
    id: item-granted-continue
- assertVisible: "Show me how to equip"
- assertVisible: "Later"
