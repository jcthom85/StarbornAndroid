appId: ${APP_ID}
---
- runFlow: reach_jed.yaml
- repeat:
    times: 30
    while:
      visible:
        id: dialogue-advance
    commands:
      - tapOn:
          id: dialogue-advance
- extendedWaitUntil:
    visible:
      id: tutorial-action
    timeout: 15000
- assertVisible: "(?s).*Mining Pistol.*Flux Liner.*Cryo-Inductor.*2 Scrap Metal.*Ration Pack.*"
- assertNotVisible:
    id: item-granted-continue
