appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Enemy Party"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "Enemy Party Combat"
    timeout: 15000
- tapOn: "Enemy Party Combat"
- extendedWaitUntil:
    visible: "Security Checkpoint B"
    timeout: 90000
- extendedWaitUntil:
    visible: "Engage Dominion Dampener"
    timeout: 10000
- tapOn: "Engage Dominion Dampener"
- extendedWaitUntil:
    visible: "HOSTILE CONTACT"
    timeout: 60000
# This flow verifies the enemy status rail renders one entry per party member.
# It previously drove an ability through a specific character first, which
# coupled it to speed-derived turn order (whose command menu is available at
# combat start varies). The rail is asserted directly instead.
- assertVisible: "Dominion Dampener"
- assertVisible: "Resonance Buoy"
- extendedWaitUntil:
    notVisible: "ATB"
    timeout: 1000
- extendedWaitUntil:
    notVisible: "R1 READY 4"
    timeout: 1000
- takeScreenshot: combat-enemy-status-rail
