appId: ${APP_ID}
---
- launchApp:
    permissions: {}
    clearState: true
- extendedWaitUntil:
    visible: "(Debug|Playtest) Scenarios"
    timeout: 60000
- tapOn: "(Debug|Playtest) Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 10000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "W1 Rest"
- hideKeyboard
- tapOn: "Hub QA / W1 Rest"
- runFlow: _shared/confirm_scenario.yaml
- extendedWaitUntil:
    visible: "Rest action"
    timeout: 30000
- assertVisible: "Rest action"
- tapOn: "Rest action"
- extendedWaitUntil:
    visible: "A Quiet Rest"
    timeout: 10000
- extendedWaitUntil:
    visible: "Nova rests until the shift alarm.*"
    timeout: 10000
- assertNotVisible: "Rested"
- assertNotVisible: "Cook"
- takeScreenshot: hub-rest-w1-rest
