appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Starborn"
    timeout: 60000
- assertVisible: "New Game"
- assertVisible: "Debug Scenarios"
- assertVisible: "Load Game"
- assertVisible: "Settings"
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- assertVisible: "Wake Up Call"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "New Game"
    timeout: 15000
