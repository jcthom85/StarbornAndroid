appId: ${APP_ID}
---
- launchApp:
    permissions: {}
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 90000
- assertVisible: "New Game"
- assertVisible: "(Debug|Playtest) Scenarios"
- assertVisible: "Load Game"
- assertVisible: "Settings"
- tapOn: "(Debug|Playtest) Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- inputText: "Opening / Wake Up Call"
- hideKeyboard
- assertVisible: "Opening / Wake Up Call"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "New Game"
    timeout: 15000
