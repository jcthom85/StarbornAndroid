appId: ${APP_ID}
---
- launchApp:
    permissions: {}
    clearState: true
- extendedWaitUntil:
    visible: "(Debug|Playtest) Scenarios"
    timeout: 60000
- tapOn: "(Debug|Playtest) Scenarios"
- tapOn: "Search world, quest, room, or system"
- inputText: "Transit Checkpoint"
- hideKeyboard
- tapOn: "Transit Checkpoint"
- runFlow: _shared/confirm_scenario.yaml
- extendedWaitUntil:
    visible: "Shift Queue"
    timeout: 15000
- extendedWaitUntil:
    visible: "New Quest"
    timeout: 10000
- assertVisible: "Shift Clearance"
- tapOn: "Continue"
- extendedWaitUntil:
    notVisible: "New Quest"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Search Bay"
    timeout: 15000
- tapOn: "Guard Hank"
- extendedWaitUntil:
    visible: "Badge on the reader.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Morning to you too."
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Rejected. Don.t make me read the reason out loud.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    notVisible: "Dialogue Popup"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "Zeke's Booth"
    timeout: 15000
- tapOn: "Zeke"
- extendedWaitUntil:
    visible: "Name, ID, clearance... Nova.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Hank rejected my badge.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Probably. Give me a moment.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Mandatory retirement.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Retirement.*Jed.s been here twice as long.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Everything they can reclaim.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "I can redirect the review to Logistics.*"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*Grid Instability.*"
    timeout: 10000
- tapOn: ".*Grid Instability.*"
- extendedWaitUntil:
    visible: "Grid Instability. Submitted.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "ITEM ACQUIRED"
    timeout: 15000
- assertVisible: "Mine Access Badge"
- tapOn: "Tap to continue"
- extendedWaitUntil:
    visible: "QUEST COMPLETED"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "New Quest"
    timeout: 15000
- assertVisible: "The Echo"
- tapOn: "Continue"
- extendedWaitUntil:
    notVisible: "New Quest"
    timeout: 10000
- tapOn: "Travel west.*"
- extendedWaitUntil:
    visible: "Search Bay"
    timeout: 15000
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Blast Door A"
    timeout: 15000
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Transit Tunnel"
    timeout: 15000
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: ".*FOREMAN REVIEW REQUIRED.*"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Concourse Lobby"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Boggs"
- extendedWaitUntil:
    visible: "Nova. I moved your temporary badge to the top of the queue.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*routed to Logistics review.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*Sector 4 needs a cutter.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*East through Customer Service to the Security Post.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "New Quest"
    timeout: 10000
- assertVisible: ".*Heavy Lifting.*"
- tapOn: "Continue"
- extendedWaitUntil:
    notVisible: "New Quest"
    timeout: 10000
- tapOn: "OVERWORLD"
- extendedWaitUntil:
    visible: "Logistics Sector"
    timeout: 15000
- assertVisible: "Enter Admin Concourse"
- tapOn: "Enter Admin Concourse"
- tapOn: "Enter"
- extendedWaitUntil:
    visible: "Concourse Lobby"
    timeout: 15000
- takeScreenshot: checkpoint-badge-gate
