appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 60000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 10000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Coolant Slag Bridge"
- hideKeyboard
- extendedWaitUntil:
    visible: "Puzzle: Coolant Slag Bridge"
    timeout: 10000
- tapOn: "Puzzle: Coolant Slag Bridge"
- extendedWaitUntil:
    visible: "Launch test"
    timeout: 10000
- tapOn: "Launch test"
- extendedWaitUntil:
    visible: "Stepping Stones"
    timeout: 30000
- assertVisible: "Stepping Stones"
- takeScreenshot: w4-01-stepping-stones-initial
- assertVisible: "cryogenic manifold valve"
- tapOn: "cryogenic manifold valve"
- extendedWaitUntil:
    visible: ".*heave the cryogenic manifold valve open.*"
    timeout: 10000
- assertVisible: "Continue"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*where solid obsidian forms a northern bridge.*"
    timeout: 10000
- takeScreenshot: w4-02-slag-bridge-solidified
- assertVisible: "Travel north"
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Subterranean Smelter Forge"
    timeout: 15000
- assertVisible: "Subterranean Smelter Forge"
- takeScreenshot: w4-03-subterranean-smelter
- assertVisible: "precursor crucible"
- tapOn: "precursor crucible"
- extendedWaitUntil:
    visible: "ITEM ACQUIRED"
    timeout: 15000
- assertVisible: "1 / 3"
- assertVisible: "Magma Induction Core"
- takeScreenshot: w4-04-crucible-item-1
- tapOn: "Tap for next"
- extendedWaitUntil:
    visible: "2 / 3"
    timeout: 5000
- assertVisible: "Pure Iron"
- takeScreenshot: w4-05-crucible-item-2
- tapOn: "Tap for next"
- extendedWaitUntil:
    visible: "3 / 3"
    timeout: 5000
- assertVisible: "Composite Plate"
- takeScreenshot: w4-06-crucible-item-3
- tapOn: "Tap to continue"
- extendedWaitUntil:
    notVisible: "ITEM ACQUIRED"
    timeout: 5000
- takeScreenshot: w4-07-crucible-looted
