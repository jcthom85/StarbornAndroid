appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Systems"
- runScript: sleep.js
- scrollUntilVisible:
    element:
      text: "Full Inventory"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 70
- extendedWaitUntil:
    visible: "Full Inventory"
    timeout: 15000
- tapOn: "Full Inventory"
- extendedWaitUntil:
    visible: "Nova's Bunk"
    timeout: 90000
- tapOn: "MENU"
- extendedWaitUntil:
    visible: "FIELD MENU"
    timeout: 10000
- assertVisible: "Inventory Overview"
- assertVisible: "Supplies"
- assertVisible: "Gear"
- assertVisible: "Key Items"
# The FIELD MENU tab row is a Compose horizontalScroll holding six chips
# (min 92.dp each), so Stats/Settings sit off-screen right on a phone viewport.
# scrollUntilVisible cannot drive it; swipe the row itself (~15% screen height).
- swipe:
    start: "85%, 15%"
    end: "20%, 15%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Stats"
- extendedWaitUntil:
    visible: "Party Status"
    timeout: 10000
- assertVisible: "Nova"
- tapOn:
    text: "Details"
    index: 0
- extendedWaitUntil:
    visible: "PRIMARY ATTRIBUTES"
    timeout: 10000
- assertVisible: "BACK"
- takeScreenshot: debug-full-inventory-menu-party-details
- tapOn: "BACK"
- extendedWaitUntil:
    visible: "Party Status"
    timeout: 10000
- swipe:
    direction: UP
    duration: 350
- assertVisible: "Zeke"
- takeScreenshot: debug-full-inventory-menu
- tapOn: "Journal"
- extendedWaitUntil:
    visible: "Quest Journal"
    timeout: 10000
- assertVisible: "Wake Up Call"
- tapOn: "Wake Up Call"
- extendedWaitUntil:
    visible: "QUEST FILE"
    timeout: 10000
- assertVisible: "BACK"
- takeScreenshot: debug-full-inventory-menu-quest-details
- tapOn: "BACK"
- extendedWaitUntil:
    visible: "Quest Journal"
    timeout: 10000
