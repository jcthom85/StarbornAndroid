appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 60000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 10000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Jungle Ruins"
- hideKeyboard
- extendedWaitUntil:
    visible: "World 2 / Jungle Ruins"
    timeout: 10000
- tapOn: "World 2 / Jungle Ruins"
- extendedWaitUntil:
    visible: "Launch test"
    timeout: 10000
- tapOn: "Launch test"
- extendedWaitUntil:
    visible: "Jungle Ruins"
    timeout: 30000
- assertVisible: "Crash Site"
- tapOn: "Enter"
- extendedWaitUntil:
    visible: "Zeke"
    timeout: 30000

# Assert that the CURRENT AREA/CURRENT ROOM label is NOT visible
- assertNotVisible: "CURRENT AREA"
- assertNotVisible: "CURRENT ROOM"

# 1. Talk to Zeke at the Crash Site (dialogue zeke_w2_crash_1)
- assertVisible: "Zeke"
- tapOn: "Zeke"
- extendedWaitUntil:
    visible: "Nova... *cough*... My head feels like a reactor breach. Are you intact?"
    timeout: 15000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "I'm fine, Zeke. The pod took the brunt of the impact. How are you holding up?"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*suit's recycler is still pumping.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*Check the wrecked nav console.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    notVisible: "Dialogue Popup"
    timeout: 10000
- extendedWaitUntil:
    visible: "Zeke joined the party."
    timeout: 10000
- tapOn: "Event Announcement. Tap to continue"
- extendedWaitUntil:
    notVisible: "Zeke joined the party."
    timeout: 10000

# 2. Examine the navigation console in the wreckage
- assertVisible: "navigation console"
- tapOn: "navigation console"
- extendedWaitUntil:
    visible: "ITEM ACQUIRED"
    timeout: 15000
- assertVisible: "Ghost Signal Cell"
- tapOn: "Tap to continue"
- extendedWaitUntil:
    visible: "Medkit"
    timeout: 5000
- tapOn: "Tap to continue"
- extendedWaitUntil:
    visible: "Ration Pack"
    timeout: 5000
- tapOn: "Tap to continue"
- extendedWaitUntil:
    visible: "Field Rod"
    timeout: 5000
- tapOn: "Tap to continue"
- extendedWaitUntil:
    visible: "Plain Chime Lure"
    timeout: 5000
- tapOn: "Tap to continue"
- extendedWaitUntil:
    notVisible: "ITEM ACQUIRED"
    timeout: 5000
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- tapOn: "Continue"

# 3. Enter Escape Pod Interior to use emergency medkit on Zeke
- assertVisible: "Travel north"
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Escape Pod Interior"
    timeout: 15000
- assertVisible: "(?i)emergency medkit"
- tapOn: "(?i)emergency medkit"
- tapOn:
    text: ".*(Continue|Tap to continue).*"
    optional: true
- assertVisible: "Travel south"
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Crash Site"
    timeout: 15000

# 4. Travel east to Stream Bank (completes w2_mq01 and starts w2_mq02)
- assertVisible: "Travel east"
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "Stream Bank"
    timeout: 15000
# Dismiss Tutorial, Quest Completed, and New Quest modals
- extendedWaitUntil:
    visible: "(?i)continue"
    timeout: 10000
- tapOn: "(?i)continue"

- extendedWaitUntil:
    visible: "(?i)continue"
    timeout: 10000
- tapOn: "(?i)continue"

- extendedWaitUntil:
    visible: "(?i)continue"
    timeout: 10000
- tapOn: "(?i)continue"

# 4. Travel south to Scorched Brush
- extendedWaitUntil:
    visible: "Travel south"
    timeout: 15000
- assertVisible: "Travel south"
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Scorched Brush"
    timeout: 15000

# 5. Travel north back to Stream Bank
- assertVisible: "Travel north"
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Stream Bank"
    timeout: 15000

# 6. Travel west to Crash Site
- assertVisible: "Travel west"
- tapOn: "Travel west"
- extendedWaitUntil:
    visible: "Crash Site"
    timeout: 15000

# 7. Travel south to Resonant Canopy (combat zone)
- assertVisible: "Travel south"
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Resonant Canopy"
    timeout: 15000

# 8. Engage the enemy in Resonant Canopy
- assertVisible: ".*Engage (Stalker Vine|Echo Borer).*"
- tapOn: ".*Engage (Stalker Vine|Echo Borer).*"
- extendedWaitUntil:
    visible: ".*(Stalker-Vine|Echo-Borer).*"
    timeout: 60000

# 9. In non-combat quest test, use instant win playtest control to resolve combat
- extendedWaitUntil:
    visible: "Instant Win"
    timeout: 10000
- tapOn: "Instant Win"

# 10. Handle victory spoils and level-up transition
- extendedWaitUntil:
    visible: "Spoils Recovered"
    timeout: 15000
- tapOn:
    text: ".*(Next|Continue).*"

# Dismiss post-combat story dialog
- extendedWaitUntil:
    visible: "(?i)continue"
    timeout: 15000
- tapOn: "(?i)continue"
- extendedWaitUntil:
    visible: "Resonant Canopy"
    timeout: 15000

# 11. Navigate to the Resonator Chamber
# Spore Thickets
- assertVisible: "Travel south"
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Spore Thickets"
    timeout: 15000

# Poison Hollow
- assertVisible: "Travel south"
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Poison Hollow"
    timeout: 15000

# Patrol Graveyard
- assertVisible: "Travel south"
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Patrol Graveyard"
    timeout: 15000

# Vine Climb
- assertVisible: "Travel east"
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "Vine Climb"
    timeout: 15000

# Windy Ledges
- assertVisible: "Travel north"
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Windy Ledges"
    timeout: 15000

# Beast Lair Approach
- assertVisible: "Travel north"
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Beast Lair Approach"
    timeout: 15000

# Canopy Ridge
- assertVisible: "Travel north"
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Canopy Ridge"
    timeout: 15000

# Shield Viewpoint
- assertVisible: "Travel east"
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "Shield Viewpoint"
    timeout: 15000

# Sniper Lookout
- assertVisible: "Travel north"
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Sniper Lookout"
    timeout: 15000

# High Pass
- assertVisible: "Travel east"
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "High Pass"
    timeout: 15000

# Sanctuary Outlook
- assertVisible: "Travel east"
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "Sanctuary Outlook"
    timeout: 15000

# Stone Courtyard
- assertVisible: "Travel east"
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "Stone Courtyard"
    timeout: 15000

# Resonator Chamber
- assertVisible: "Travel east"
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "Resonator Chamber"
    timeout: 15000

# 12. Interact with Sentinel-3 shop
- assertVisible: ".*(Sentinel Scraps|Sentinel S).*"
- tapOn: ".*(Sentinel Scraps|Sentinel S).*"
- extendedWaitUntil:
    visible: "Sentinel Scraps"
    timeout: 15000
- tapOn:
    text: ".*(Back|Close Shop).*"
- extendedWaitUntil:
    visible: "Resonator Chamber"
    timeout: 15000

# 13. Walk to Temple Gate
- assertVisible: "Travel east"
- tapOn: "Travel east"

# Dismiss story dialog upon discovering Temple Gate
- extendedWaitUntil:
    visible: "(?i)continue"
    timeout: 15000
- tapOn: "(?i)continue"
- extendedWaitUntil:
    visible: "Temple Gate"
    timeout: 15000

# 14. Use the Chime on the Stone Lock to open the Temple Gate
- assertVisible: "(?i)stone lock"
- tapOn: "(?i)stone lock"

# Dismiss quest completion modal
- extendedWaitUntil:
    visible: "(?i)continue"
    timeout: 15000
- tapOn: "(?i)continue"
- extendedWaitUntil:
    visible: "Hall of Echoes"
    timeout: 15000

# Take screenshot to verify World 2 completion
- takeScreenshot: mainquest-world2-completed
