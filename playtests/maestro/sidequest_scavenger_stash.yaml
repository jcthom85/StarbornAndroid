appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Scavenger"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "Scavenger's Stash"
    timeout: 15000
- tapOn: "Scavenger's Stash"
- extendedWaitUntil:
    visible: "Scrapper's Stall"
    timeout: 90000
- tapOn: "Talk to Scrapper"
- extendedWaitUntil:
    visible: ".*Old resistance stock.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Why not grab it yourself?"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*Find the crate.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    notVisible: "Dialogue Popup"
    timeout: 10000
- extendedWaitUntil:
    visible: "New Quest"
    timeout: 10000
- assertVisible: "The Scavenger's Stash"
- tapOn: "Dismiss"
- extendedWaitUntil:
    notVisible: "New Quest"
    timeout: 10000
# The "Quest Updated" banner is a 5s transient and cannot be asserted
# reliably: one Maestro hierarchy dump can outlast the dismiss window.
# Progression is verified by the room/action steps and the quest completion
# popup instead. Confirmed on device that the banner itself does render.
#
# Accepting the quest no longer emits a second "Quest Updated" banner. The
# vestigial "Talk to Scrapper" task was removed, so the quest opens on its
# first real objective instead of one the player already satisfied.
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Market Strip"
    timeout: 15000
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "The Hidden Stash"
    timeout: 15000
- tapOn: "Inspect Rebel cache"
- extendedWaitUntil:
    visible: "Rebel Cache"
    timeout: 10000
- assertVisible: "Pulse Grenade"
- tapOn: "Dismiss Event Announcement"
- extendedWaitUntil:
    notVisible: "Rebel Cache"
    timeout: 10000
- tapOn: "Travel west"
- extendedWaitUntil:
    visible: "Market Strip"
    timeout: 15000
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Scrapper's Stall"
    timeout: 15000
- tapOn: "Talk to Scrapper"
- extendedWaitUntil:
    visible: ".*You opened it.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "They scratched names into the lid."
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*Take the grenades.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Quest Completed"
    timeout: 10000
- assertVisible: "The Scavenger's Stash"
- tapOn: "Dismiss"
- extendedWaitUntil:
    notVisible: "Quest Completed"
    timeout: 10000
- takeScreenshot: sidequest-scavenger-stash
