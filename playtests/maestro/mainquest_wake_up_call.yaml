appId: ${APP_ID}
---
- runFlow: fun_opening_mastery.yaml
- tapOn: "Tap to continue"
- tapOn: "Back"
- extendedWaitUntil:
    visible: ".*Cold loop: 68%.*ground the Flux Liner.*governor bypass.*"
    timeout: 20000
- tapOn: "Continue"
- repeat:
    times: 5
    commands:
      - tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Jed's Shutter"
    timeout: 15000
- assertVisible: "Flux Liner"
- tapOn: "Flux Liner"
- tapOn:
    point: "50%,55%"
- assertVisible: "mining cutter"
- tapOn: "mining cutter"
- extendedWaitUntil:
    visible: ".*Factory sweep limit: 61 kHz.*"
    timeout: 10000
- tapOn: ".*Factory sweep limit: 61 kHz.*"
- tapOn: "live cutter test"
- extendedWaitUntil:
    visible: ".*Flux Liner's ground strip.*governor bypass.*"
    timeout: 15000
- tapOn: "Tap to continue.*"
- extendedWaitUntil:
    visible: ".*One sweep.*watching the heat.*"
    timeout: 10000
- tapOn:
    point: "50%,85%"
- extendedWaitUntil:
    visible: ".*cutter fires.*buried.*conduit.*"
    timeout: 10000
- tapOn: "Tap to continue.*"
- extendedWaitUntil:
    visible: ".*Kill it.*"
    timeout: 10000
- tapOn:
    point: "50%,85%"
- extendedWaitUntil:
    visible: ".*I have. Jed... it.s still answering.*"
    timeout: 10000
- tapOn:
    point: "50%,85%"
- extendedWaitUntil:
    visible: ".*CUTTER FAULT 4C-117.*NOVA VANCE.*"
    timeout: 15000
- tapOn: "Tap to continue.*"
- extendedWaitUntil:
    visible: "QUEST COMPLETED"
    timeout: 15000
