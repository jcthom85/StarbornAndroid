appId: ${APP_ID}
---
# The first tutorial no longer fires immediately after New Game. The fun-factor
# onboarding pass removed the up-front interruptions, so the movement tutorial
# now appears only once the player has acted in the bunk (light, then conduit).
# The dismiss button is "Continue"; the old "GOT IT" label no longer exists.
- launchApp:
    permissions: {}
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- tapOn: "New Game"
- extendedWaitUntil:
    visible: "Nova's Bunk"
    timeout: 90000
- tapOn: "bunk light"
- tapOn: ".*The bunk light coughs on.*"
- tapOn: "door control panel"
- extendedWaitUntil:
    visible: ".*three repair requests.*closed automatically.*"
    timeout: 15000
- tapOn: ".*three repair requests.*closed automatically.*"
- extendedWaitUntil:
    visible: "Swipe toward any open exit to move.*"
    timeout: 15000
- assertVisible: "CONTINUE"
- tapOn: "CONTINUE"
- extendedWaitUntil:
    notVisible: "CONTINUE"
    timeout: 10000
- assertVisible: "Nova's Bunk"
- takeScreenshot: early-tutorial-dismissed
