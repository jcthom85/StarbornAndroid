appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- tapOn: "New Game"
- extendedWaitUntil:
    visible: ".*SECTOR 9.*TWENTY YEARS EARLIER.*"
    timeout: 90000
- takeScreenshot: intro-location-plate
- extendedWaitUntil:
    visible: ".*SOURCE BEAST CONTAINMENT BREACH.*FAR DOOR PRESSURE RISING.*"
    timeout: 12000
- extendedWaitUntil:
    visible: ".*inner doors buckle.*locks the brass Chime.*"
    timeout: 12000
- takeScreenshot: intro-narration-caption
- extendedWaitUntil:
    visible: ".*Broadcast my identity.*Draw it away.*"
    timeout: 20000
- takeScreenshot: intro-unknown-dialogue
# The cold open runs ~34.5s (it gained the Chorus beat, the threat beat, and the
# title card), so the tail after this point is longer than the old 45s allowance.
- extendedWaitUntil:
    visible: "Nova's Bunk"
    timeout: 120000
- extendedWaitUntil:
    notVisible: "New Game"
    timeout: 20000
- takeScreenshot: start-new-game
