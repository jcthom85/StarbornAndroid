appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 60000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 10000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Executive Laser Grid"
- hideKeyboard
- extendedWaitUntil:
    visible: "Puzzle: Executive Laser Grid"
    timeout: 10000
- tapOn: "Puzzle: Executive Laser Grid"
- extendedWaitUntil:
    visible: "Launch test"
    timeout: 10000
- tapOn: "Launch test"
- extendedWaitUntil:
    visible: "Donor Gallery"
    timeout: 30000
- assertVisible: "Donor Gallery"
- takeScreenshot: w3-01-donor-gallery-initial
- assertVisible: "laser grid console"
- tapOn: "laser grid console"
- extendedWaitUntil:
    visible: ".*unsealing the northern corridor.*"
    timeout: 10000
- assertVisible: "Continue"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*keeping the northern corridor open.*"
    timeout: 10000
- takeScreenshot: w3-02-laser-grid-bypassed
- assertVisible: "Travel north"
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Executive Black-Site Lab"
    timeout: 15000
- assertVisible: "Executive Black-Site Lab"
- takeScreenshot: w3-03-black-site-lab
- assertVisible: "black-box safe"
- tapOn: "black-box safe"
- extendedWaitUntil:
    visible: "ITEM ACQUIRED"
    timeout: 15000
- assertVisible: "1 / 3"
- assertVisible: "Syndicate Overclock"
- takeScreenshot: w3-04-safe-item-1
- tapOn: "Tap for next"
- extendedWaitUntil:
    visible: "2 / 3"
    timeout: 5000
- assertVisible: "Circuit Board"
- takeScreenshot: w3-05-safe-item-2
- tapOn: "Tap for next"
- extendedWaitUntil:
    visible: "3 / 3"
    timeout: 5000
- assertVisible: "Battery"
- takeScreenshot: w3-06-safe-item-3
- tapOn: "Tap to continue"
- extendedWaitUntil:
    notVisible: "ITEM ACQUIRED"
    timeout: 5000
- takeScreenshot: w3-07-safe-looted
