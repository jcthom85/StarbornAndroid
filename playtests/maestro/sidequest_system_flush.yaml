appId: com.junewiregames.starborn.prealpha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New Game"
    timeout: 60000
- extendedWaitUntil:
    visible: "Debug Scenarios"
    timeout: 10000
- tapOn: "Debug Scenarios"
- extendedWaitUntil:
    visible: "Search world, quest, room, or system"
    timeout: 15000
- tapOn: "Search world, quest, room, or system"
- eraseText
- inputText: "Room"
- runScript: sleep.js
- extendedWaitUntil:
    visible: "Room Items"
    timeout: 15000
- tapOn: "Room Items"
- extendedWaitUntil:
    visible: "Med Supply Closet"
    timeout: 90000
- tapOn: "Travel west"
- extendedWaitUntil:
    visible: "Doc's Exam Room"
    timeout: 15000
- tapOn: "Doc"
- extendedWaitUntil:
    visible: ".*vents are backing poison.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Again?"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*Patch the cracked vent.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    notVisible: "Dialogue Popup"
    timeout: 10000
- extendedWaitUntil:
    visible: "New Quest"
    timeout: 10000
- assertVisible: "System Flush"
- tapOn: "Dismiss"
- extendedWaitUntil:
    notVisible: "New Quest"
    timeout: 10000
# The "Quest Updated" banner is a 5s transient and cannot be asserted
# reliably: one Maestro hierarchy dump can outlast the dismiss window.
# Progression is verified by the room/action steps and the quest completion
# popup instead. Confirmed on device that the banner itself does render.
#
# Accepting the quest no longer emits a second "Quest Updated" banner. The
# vestigial "Talk to Doc" task was removed, so the quest opens on its first
# real objective instead of announcing one the player already satisfied.
- takeScreenshot: sidequest-system-flush-progress
- tapOn: "Travel south"
- extendedWaitUntil:
    visible: "Triage Hall"
    timeout: 15000
- tapOn: "Travel east"
- extendedWaitUntil:
    visible: "Ventilation Hub"
    timeout: 15000
# Each vent action raises its own narrative card that must be dismissed before
# the next inline keyword is tappable.
- tapOn: "Inspect Vent"
- extendedWaitUntil:
    visible: ".*crack is not the real problem.*"
    timeout: 15000
- tapOn: ".*crack is not the real problem.*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Inspect Fans"
- extendedWaitUntil:
    visible: ".*fans grind into reverse.*"
    timeout: 15000
- tapOn: ".*fans grind into reverse.*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Inspect Toxic Blockage"
- extendedWaitUntil:
    visible: ".*blockage tears free.*"
    timeout: 15000
- tapOn: ".*blockage tears free.*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Travel west"
- extendedWaitUntil:
    visible: "Triage Hall"
    timeout: 15000
- tapOn: "Travel north"
- extendedWaitUntil:
    visible: "Doc's Exam Room"
    timeout: 15000
- tapOn: "Doc"
- extendedWaitUntil:
    visible: ".*coughing stopped.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*Fixed. Mostly.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: ".*Corrosive rounds.*"
    timeout: 10000
- tapOn: "Dialogue Popup. Tap to continue"
- extendedWaitUntil:
    visible: "Quest Completed"
    timeout: 10000
- assertVisible: "System Flush"
- tapOn: "Dismiss"
- extendedWaitUntil:
    notVisible: "Quest Completed"
    timeout: 10000
- takeScreenshot: sidequest-system-flush
